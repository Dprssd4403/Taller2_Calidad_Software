{% extends 'base.html' %}

{% block title %}Eliminar Pokémon{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
    <div class="card border-danger shadow">
        <div class="card-header bg-danger text-white">
            <h5 class="m-0">Confirmar Eliminación</h5>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">¿Estás seguro de que deseas eliminar a <strong class="text-capitalize">{{ pokemon.name }}</strong> (#{{ pokemon.poke_id }})?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'pokemon_list' %}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
