{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 550px;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden bg-white text-dark">
        <!-- Cabecera con estilo pro -->
        <div class="card-header bg-dark text-white text-center py-3 border-0">
            <h4 class="m-0 fw-bold">{{ title }}</h4>
        </div>
        <div class="card-body text-start p-4">
            <form method="POST" novalidate>
                {% csrf_token %}
                
                {{ form.as_p }}

                <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
                    <a href="{% url 'pokemon_list' %}" class="btn btn-outline-secondary px-4 py-2 rounded-pill fw-semibold">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-5 py-2 rounded-pill fw-semibold shadow-sm">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Estilo limpio para los campos generados por form.as_p -->
<style>
    p label {
        font-weight: 600;
        margin-bottom: 0.3rem;
        color: #334155;
    }
    p input, p select, p textarea {
        display: block;
        width: 100%;
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #212529;
        background-color: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 0.5rem;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }
    p input:focus {
        border-color: #ef4444;
        outline: 0;
        box-shadow: 0 0 0 0.25rem rgba(239, 68, 68, 0.25);
        background-color: #fff;
    }
</style>
{% endblock %}
