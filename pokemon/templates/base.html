<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>
        {% block title %}
        Pokédex
        {% endblock %}
    </title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fondo estilo gamer / pro oscuro con un toque degradado */
            background-color: #0b0f19;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
            color: #e2e8f0;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary shadow-lg py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2 text-danger" href="{% url 'pokemon_list' %}">
                ⚡ PokéDex App
            </a>
            <span class="text-muted small">Panel CRUD & API</span>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container py-5 flex-grow-1">
        {% block content %} 
        {% endblock %}
    </main>

    <!-- Footer Natural -->
    <footer class="bg-dark text-muted text-center py-3 mt-auto border-top border-secondary small">
        <p class="mb-0">Pokédex MVT • Django & Bootstrap</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
